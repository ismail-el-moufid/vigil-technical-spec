name: Export spec data as JSON

# Manually trigger from the Actions tab, or it fires automatically whenever
# src/data/**.js changes on main. Either way it converts src/data's exports
# to JSON and publishes a GitHub Release with the JSON files attached, so you
# always have a stable download link to hand to an AI tool.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/data/**"

permissions:
  contents: write

jobs:
  export-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export data as JSON
        run: node scripts/export-json.mjs dist/json

      - name: Generate release tag
        id: tag
        run: echo "tag=data-$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Spec data — ${{ steps.tag.outputs.tag }}"
          files: dist/json/*.json
          body: |
            Auto-generated JSON export of `src/data`'s exports (one file per
            export, plus `all.json` with everything combined) as of this
            commit. Download the attached JSON files below and hand them
            straight to an AI tool.
