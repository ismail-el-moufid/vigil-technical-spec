name: Export spec data as JSON

# Manually trigger from the Actions tab, or it fires automatically whenever
# data files change on master. Either way it converts src/data's exports
# to JSON and publishes a GitHub Release with the JSON files attached, so you
# always have a stable download link to hand to an AI tool.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/data/**"
      - ".github/workflows/export-data.yml"
      - "scripts/export-json.mjs"

permissions:
  contents: write

jobs:
  export-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export data as JSON
        run: node scripts/export-json.mjs dist/json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spec-as-json
          name: "spec as json"
          files: dist/json/*.json
          body: |
            Auto-generated JSON export of `src/data`, refreshed on every push to `master` that touches the data files. Grab whichever file below matches what you need and hand it to an AI tool.

            | File | What's in it |
            |---|---|
            | [`endpoints.json`](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/endpoints.json) | All endpoint groups — Auth, Config, Telemetry, Alerts, Users, Webhooks, AI, Internal |
            | [`pages.json`](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/pages.json) | Page definitions |
            | [`schema.json`](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/schema.json) | Data schema |
            | [`Security.json`](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/Security.json) | Everything else — auth strategies, filter chain, startup sequence, rate limiting, role enforcement |
            | [`Full Spec.json`](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/Full%20Spec.json) | Everything above combined into one file |

            <details>
            <summary><b>Not sure which one to grab?</b></summary>

            - Just need API shapes? → `endpoints.json`
            - Building a security review or threat model? → `Security.json`
            - Want the AI tool to have the whole picture in one shot? → `Full Spec.json`

            </details>

            <details>
            <summary>⚠️ About the "Source code (zip)" link below</summary>

            That's auto-generated by GitHub for every release and isn't part of this export — it's just a snapshot of the repo. Use the files listed in the table above instead.

            </details>
