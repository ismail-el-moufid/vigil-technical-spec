name: Export spec data as JSON

# Manually trigger from the Actions tab, or it fires automatically whenever
# data files change on main. Either way it converts src/data's exports
# to JSON and publishes a GitHub Release with the JSON files attached, so you
# always have a stable download link to hand to an AI tool.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/data/**"
      - ".github/workflows/export-data.yml"
      - "scripts/export-json.mjs"

permissions:
  contents: write

jobs:
  export-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export data as JSON
        run: node scripts/export-json.mjs dist/json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spec-as-json
          name: "spec as json"
          files: dist/json/*.json
          body: |
            Auto-generated JSON export of `src/data`'s exports (one file per
            export, plus `all.json` with everything combined) from the latest
            run. Download the attached JSON files below and hand them straight
            to an AI tool.
