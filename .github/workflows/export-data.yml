name: Export spec data as JSON

# Manually trigger from the Actions tab, or it fires automatically whenever
# data files change on master. Either way it converts src/data's exports
# to JSON and publishes a GitHub Release with the JSON files attached, so you
# always have a stable download link to hand to an AI tool.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "src/data/**"
      - ".github/workflows/export-data.yml"
      - "scripts/export-json.mjs"

permissions:
  contents: write

jobs:
  export-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export data as JSON
        run: node scripts/export-json.mjs dist/json

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: spec-as-json
          name: "spec as json"
          files: dist/json/*.json
          body: |
            Auto-generated JSON export of `src/data`, refreshed on every push to `master` that touches the data files. Grab whichever file below matches what you need and hand it to an AI tool.

            | File | What's in it |
            |---|---|
            | [Endpoints.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/Endpoints.json) | All endpoint groups combined, see the breakdown below if you only need one group |
            | [Pages.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/Pages.json) | Page definitions |
            | [Schema.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/Schema.json) | Data schema |
            | [Security.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/Security.json) | Everything else, auth strategies, filter chain, startup sequence, rate limiting, role enforcement |
            | [FullSpec.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/FullSpec.json) | Everything above combined into one file |

            <details>
            <summary><b>Just need one endpoint group?</b> Grab it standalone instead of the whole <code>Endpoints.json</code></summary>

            | Group | File |
            |---|---|
            | Auth | [AuthEndpoints.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/AuthEndpoints.json) |
            | Config | [ConfigEndpoints.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/ConfigEndpoints.json) |
            | Telemetry | [TelemetryEndpoints.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/TelemetryEndpoints.json) |
            | Alerts | [AlertsEndpoints.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/AlertsEndpoints.json) |
            | Users | [UsersEndpoints.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/UsersEndpoints.json) |
            | Webhooks | [WebhooksEndpoints.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/WebhooksEndpoints.json) |
            | AI | [AiEndpoints.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/AiEndpoints.json) |
            | Internal | [InternalEndpoints.json](https://github.com/ismail-el-moufid/vigil-technical-spec/releases/download/spec-as-json/InternalEndpoints.json) |

            </details>

            <details>
            <summary><b>Not sure which one to grab?</b></summary>

            - Just need API shapes for one integration? → the matching file in the table above
            - Need every endpoint at once? → `Endpoints.json`
            - Building a security review or threat model? → `Security.json`
            - Want the AI tool to have the whole picture in one shot? → `FullSpec.json`

            </details>
