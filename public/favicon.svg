<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="fv-shimmer" x1="0" y1="0" x2="1" y2="0" gradientTransform="translate(-1 0)">
      <stop offset="0%" stop-color="#00ffb3"/>
      <stop offset="38%" stop-color="#00ffb3"/>
      <stop offset="50%" stop-color="#f4fffb"/>
      <stop offset="62%" stop-color="#00ffb3"/>
      <stop offset="100%" stop-color="#00ffb3"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6.5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- shield -->
  <path d="M24 44s16-8 16-20V10l-16-6-16 6v14c0 12 16 20 16 20z" fill="url(#fv-shimmer)"/>

  <!-- pulse / check mark cut-out -->
  <path d="M15 24l6.5 6.5L33 17" fill="none" stroke="#07080c" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sparkles -->
  <circle cx="15.5" cy="14.5" r="1.3" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.005;0.03;0.055;1" dur="6.5s" begin="0.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="33.5" cy="16" r="1.1" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.005;0.03;0.055;1" dur="6.5s" begin="2.25s" repeatCount="indefinite"/>
  </circle>
  <circle cx="24" cy="35" r="1.2" fill="#ffffff" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.005;0.03;0.055;1" dur="6.5s" begin="4.4s" repeatCount="indefinite"/>
  </circle>
</svg>
